[project]
name = "scamshield-backend"
version = "0.2.0"
description = "Scam Shield backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "gunicorn>=22,<23",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.4,<3",
    "boto3>=1.34,<2",
    "pgvector>=0.3,<1",
    "pytesseract>=0.3.10,<1",
    "pillow>=13,<14",
    "python-json-logger>=2.0,<3",
    # AI module dependencies (scamshield_ml):
    "torch>=2.2,<3",
    # Keep the model stack on supported major releases; older 4.x
    # Transformers and 10.x Pillow lines have published advisories.
    "transformers>=5.10,<6",
    "sentence-transformers>=5.6,<6",
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring live dependencies (e.g. the compose Postgres)",
]
